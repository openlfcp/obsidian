name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: obsidian
    steps:
      - uses: actions/checkout@v7
        with:
          path: obsidian
      # Tests read MARKDOWN-REFS-01 and spec fixtures from a spec checkout
      # next to this repository (../spec) at the tag pinned in spec.lock.
      - id: spec-lock
        run: echo "tag=$(jq -er .tag spec.lock)" >> "$GITHUB_OUTPUT"
      # Full history with tags, so the tests can check that the tag still
      # resolves to the commit in spec.lock.
      - uses: actions/checkout@v7
        with:
          repository: openlfcp/spec
          ref: refs/tags/${{ steps.spec-lock.outputs.tag }}
          path: spec
          fetch-depth: 0
      # The TypeScript SDK: until @openlfcp/* 0.7.0 is on npm, the eight
      # packages of openlfcp/sdk-ts at the commit in sdk-ts.lock, packed by
      # scripts/sdk-ts-pack.mjs into vendor/sdk-ts/; pnpm-lock.yaml holds each
      # tarball's integrity (CONTRIBUTING.md, "The SDK pin").
      - id: sdk-ts-lock
        run: echo "commit=$(jq -er .commit sdk-ts.lock)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: openlfcp/sdk-ts
          ref: ${{ steps.sdk-ts-lock.outputs.commit }}
          path: sdk-ts
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: obsidian/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: obsidian/pnpm-lock.yaml
      - run: node scripts/sdk-ts-pack.mjs
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run lint
      # The community Scorecard's lint (eslint-plugin-obsidianmd) over src/: zero warnings.
      - run: pnpm run lint:obsidian
      - run: pnpm run typecheck
      - run: pnpm test
      - name: Build leaves the tree clean
        run: test -z "$(git status --porcelain)"
