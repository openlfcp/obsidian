name: Native harness

# The built plugin in a real Obsidian (docs/devel/testing/native-harness.md),
# on three systems and both pinned Obsidian versions. Manual only for now:
# run it from the Actions tab ("Run workflow"). The METRIC lines are kept as
# an artifact and never gate (numbers vary by runner).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        obsidian: ["1.13.4", "1.14.4"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      NATIVE_OBSIDIAN: ${{ matrix.obsidian }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            test/native/pnpm-lock.yaml
      - name: Put the Obsidian cache in the runner's temp directory
        run: echo "OPENLFCP_OBSIDIAN_CACHE=$RUNNER_TEMP/obsidian-cache" >> "$GITHUB_ENV"
      # Obsidian's installer and app bundle, about 630 MB per system and version.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/obsidian-cache
          key: obsidian-${{ runner.os }}-${{ matrix.obsidian }}-${{ hashFiles('test/native/pnpm-lock.yaml') }}
          restore-keys: obsidian-${{ runner.os }}-${{ matrix.obsidian }}-
      - run: pnpm install --frozen-lockfile
      - name: Run the harness (Linux needs a virtual display)
        run: |
          set -o pipefail
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a pnpm native 2>&1 | tee native.log
          else
            pnpm native 2>&1 | tee native.log
          fi
      - name: Keep the log and the METRIC lines
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-${{ matrix.os }}-${{ matrix.obsidian }}
          path: native.log
          if-no-files-found: ignore
