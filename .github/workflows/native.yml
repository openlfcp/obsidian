name: Native harness

# The built plugin in a real Obsidian (docs/devel/testing/native-harness.md).
# Manual only: Actions -> "Native harness" -> Run workflow, or
#   gh workflow run native.yml --ref <branch> -f specs=smoke -f os=ubuntu-latest -f obsidian=1.14.4
# The live specs run against the reference server built at server.lock
# (LFCP_SERVER_BIN, LFCP_REQUIRE_LIVE=1): without it they fail, never skip.
# Each log, METRIC and EVIDENCE lines included, is kept as an artifact;
# metrics never gate.

on:
  workflow_dispatch:
    inputs:
      specs:
        description: "Specs: names (smoke), file names or globs (section-*) under test/native/specs, comma- or space-separated. Empty: all"
        required: false
        default: ""
      os:
        description: "Systems, comma-separated: ubuntu-latest, macos-latest, windows-latest"
        required: false
        default: ubuntu-latest
      obsidian:
        description: "Obsidian versions, comma-separated (pinned: 1.13.4, 1.14.4)"
        required: false
        default: "1.14.4"
      release_build:
        description: "Test the release build (no LFCP_DEV_PANE): the exact main.js a release ships; specs/pane-prototype is left out; main.js sha256 is printed (LFCP-03-027)"
        type: boolean
        required: false
        default: false
      perf:
        description: "Run the performance measurements (test/native/perf, LFCP-03-026) instead of the specs; never gating"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      os: ${{ steps.matrix.outputs.os }}
      obsidian: ${{ steps.matrix.outputs.obsidian }}
    steps:
      - id: matrix
        env:
          OS_INPUT: ${{ inputs.os }}
          OBSIDIAN_INPUT: ${{ inputs.obsidian }}
        run: |
          to_json() { tr ',' ' ' | xargs -n1 | jq -Rnc '[inputs]'; }
          os=$(printf '%s' "${OS_INPUT:-ubuntu-latest}" | to_json)
          obsidian=$(printf '%s' "${OBSIDIAN_INPUT:-1.14.4}" | to_json)
          bad=$(jq -r '.[] | select(IN("ubuntu-latest", "macos-latest", "windows-latest") | not)' <<<"$os")
          if [ -n "$bad" ] || [ "$os" = "[]" ]; then echo "::error::os: unknown or empty: $bad"; exit 1; fi
          bad=$(jq -r '.[] | select(test("^[0-9]+\\.[0-9]+\\.[0-9]+$") | not)' <<<"$obsidian")
          if [ -n "$bad" ] || [ "$obsidian" = "[]" ]; then echo "::error::obsidian: not a version: $bad"; exit 1; fi
          echo "os=$os" >> "$GITHUB_OUTPUT"
          echo "obsidian=$obsidian" >> "$GITHUB_OUTPUT"
          echo "os=$os obsidian=$obsidian"

  # The reference server at server.lock, once per system; sdk-rs at the
  # server's own sdk-rs.lock (a path dependency, ../sdk-rs). The toolchain is
  # the server's rust-toolchain.toml, through the runner's rustup.
  server:
    needs: plan
    name: server (${{ matrix.os }})
    strategy:
      fail-fast: true
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.os) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/server-target
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: obsidian
          sparse-checkout: server.lock
          sparse-checkout-cone-mode: false
      - id: pins
        run: echo "server=$(jq -er .commit obsidian/server.lock)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: openlfcp/server
          ref: ${{ steps.pins.outputs.server }}
          path: server
      - id: sdk-rs
        run: echo "commit=$(jq -er .commit server/sdk-rs.lock)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: openlfcp/sdk-rs
          ref: ${{ steps.sdk-rs.outputs.commit }}
          path: sdk-rs
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ env.CARGO_TARGET_DIR }}
          key: lfcp-server-release-${{ runner.os }}-${{ steps.pins.outputs.server }}-${{ hashFiles('server/Cargo.lock') }}
          restore-keys: lfcp-server-release-${{ runner.os }}-
      - name: Build the reference server (release)
        working-directory: server
        run: |
          cargo build --release --locked -p lfcp-server
          exe=lfcp-server
          if [ "$RUNNER_OS" = "Windows" ]; then exe=lfcp-server.exe; fi
          mkdir -p "$RUNNER_TEMP/lfcp-server"
          cp "$CARGO_TARGET_DIR/release/$exe" "$RUNNER_TEMP/lfcp-server/"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lfcp-server-${{ matrix.os }}
          path: ${{ runner.temp }}/lfcp-server
          if-no-files-found: error
          retention-days: 3

  native:
    needs: [plan, server]
    name: native (${{ matrix.os }}, Obsidian ${{ matrix.obsidian }})
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.os) }}
        obsidian: ${{ fromJSON(needs.plan.outputs.obsidian) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      NATIVE_OBSIDIAN: ${{ matrix.obsidian }}
      # specs/pane-prototype's screenshots, kept with the log.
      LFCP_SCREENSHOT_DIR: ${{ github.workspace }}/obsidian/screenshots
      # The live specs' server: the one built above, never a default location.
      LFCP_REQUIRE_LIVE: "1"
      # perf: wdio.conf.mjs runs test/native/perf/*.perf.mjs; raw samples go to perf-results/.
      NATIVE_PERF: ${{ inputs.perf && '1' || '' }}
      NATIVE_RELEASE_BUILD: ${{ inputs.release_build && '1' || '' }}
      LFCP_PERF_DIR: ${{ github.workspace }}/obsidian/perf-results
      # The older plugin releases specs/upgrade-install.e2e.mjs and
      # specs/upgrade-rollback.e2e.mjs update from (and roll back to).
      UPGRADE_FROM: 0.3.4 0.4.0-beta.15 0.4.1 0.4.2
    defaults:
      run:
        shell: bash
        working-directory: obsidian
    steps:
      - name: Keep line endings as committed
        working-directory: .
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: obsidian
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: lfcp-server-${{ matrix.os }}
          path: ${{ runner.temp }}/lfcp-server
      - name: Point LFCP_SERVER_BIN at the server (server.lock)
        run: |
          exe=lfcp-server
          if [ "$RUNNER_OS" = "Windows" ]; then exe=lfcp-server.exe; fi
          bin="$RUNNER_TEMP/lfcp-server/$exe"
          chmod +x "$bin"
          test -x "$bin" || { echo "::error::no server binary at $bin"; exit 1; }
          echo "LFCP_SERVER_BIN=$bin" >> "$GITHUB_ENV"
          echo "server.lock: $(jq -er .commit server.lock)"
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          package_json_file: obsidian/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            obsidian/pnpm-lock.yaml
            obsidian/test/native/pnpm-lock.yaml
      - name: Put the Obsidian cache in the runner's temp directory
        run: echo "OPENLFCP_OBSIDIAN_CACHE=$RUNNER_TEMP/obsidian-cache" >> "$GITHUB_ENV"
      # Obsidian's installer and app bundle, about 630 MB per system and version.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/obsidian-cache
          key: obsidian-${{ runner.os }}-${{ matrix.obsidian }}-${{ hashFiles('obsidian/test/native/pnpm-lock.yaml') }}
          restore-keys: obsidian-${{ runner.os }}-${{ matrix.obsidian }}-
      # Without them the upgrade cases would skip; the check below fails on any skip.
      - name: Fetch the older releases the upgrade spec installs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for v in $UPGRADE_FROM; do
            dir="$OPENLFCP_OBSIDIAN_CACHE/releases/$v"
            if [ ! -f "$dir/main.js" ] || [ ! -f "$dir/manifest.json" ] || [ ! -f "$dir/styles.css" ]; then
              gh release download "$v" -R "$GITHUB_REPOSITORY" -D "$dir" --clobber \
                -p main.js -p manifest.json -p styles.css
            fi
            ls -l "$dir"
          done
      # A developer build: specs/pane-prototype needs the pane prototype,
      # which a release build leaves out (test/bundle.test.ts checks that one).
      - name: Build the plugin and the harness
        env:
          LFCP_DEV_PANE: ${{ inputs.release_build && '0' || '1' }}
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
          if [ "$NATIVE_RELEASE_BUILD" = "1" ]; then
            echo "release build: $(git rev-parse HEAD)"
            sha256sum main.js manifest.json manifest-beta.json styles.css | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          node scripts/build-native-harness.mjs
          pnpm --dir test/native install --frozen-lockfile
      - name: Choose the specs
        id: choose
        env:
          SPECS: ${{ inputs.specs }}
        run: |
          shopt -s nullglob
          # The measurements: every perf/*.perf.mjs (wdio.conf.mjs picks them), no spec, no known-failing list.
          if [ "$NATIVE_PERF" = "1" ]; then
            : > "$RUNNER_TEMP/native-args"
            : > "$RUNNER_TEMP/known-failing"
            echo "gating=1" >> "$GITHUB_OUTPUT"
            echo "known=0" >> "$GITHUB_OUTPUT"
            echo "perf measurements"
            exit 0
          fi
          IFS=', ' read -r -a patterns <<<"$SPECS"
          selected=()
          for s in "${patterns[@]}"; do
            [ -n "$s" ] || continue
            s=${s#test/native/}; s=${s#specs/}; s=${s%.mjs}; s=${s%.e2e}
            # shellcheck disable=SC2206 # the pattern is a glob on purpose
            files=(test/native/specs/$s.e2e.mjs)
            # A name without glob characters is not expanded: check it exists.
            if [ ${#files[@]} -eq 0 ] || [ ! -f "${files[0]}" ]; then echo "::error::no spec matches '$s'"; exit 1; fi
            selected+=("${files[@]}")
          done
          # Paths relative to test/native, where the harness runs WebdriverIO.
          args=()
          for f in "${selected[@]}"; do args+=("--spec" "${f#test/native/}"); done
          if [ ${#selected[@]} -eq 0 ]; then selected=(test/native/specs/*.e2e.mjs); fi
          # A release build has no pane prototype (D11): its spec cannot run.
          if [ "$NATIVE_RELEASE_BUILD" = "1" ]; then
            kept=()
            for f in "${selected[@]}"; do [ "$f" = "test/native/specs/pane-prototype.e2e.mjs" ] || kept+=("$f"); done
            selected=("${kept[@]}")
            if [ -z "$SPECS" ]; then
              args=()
              for f in "${selected[@]}"; do args+=("--spec" "${f#test/native/}"); done
            fi
          fi
          # Known failing specs (test/native/known-failing.txt): out of the gating run.
          : > "$RUNNER_TEMP/known-failing"
          known=0
          # The last line counts even without a newline.
          while read -r name task _ || [ -n "$name" ]; do
            case "$name" in "" | "#"*) continue ;; esac
            [[ "$task" =~ ^LFCP-[0-9]{2}-[0-9]{3}$ ]] || { echo "::error::known-failing.txt: $name has no task"; exit 1; }
            f="test/native/specs/$name.e2e.mjs"
            if [ ! -f "$f" ]; then echo "::error::known-failing.txt names no spec: $name"; exit 1; fi
            if printf '%s\n' "${selected[@]}" | grep -qxF "$f"; then
              args+=("--exclude" "${f#test/native/}")
              printf '%s\t%s\n' "$name" "$task" >> "$RUNNER_TEMP/known-failing"
              known=$((known + 1))
            fi
          done < test/native/known-failing.txt
          printf '%s\0' "${args[@]}" > "$RUNNER_TEMP/native-args"
          echo "gating=$(( ${#selected[@]} - known ))" >> "$GITHUB_OUTPUT"
          echo "known=$known" >> "$GITHUB_OUTPUT"
          if [ -z "$SPECS" ]; then echo "all specs"; fi
          printf '%s\n' "${args[@]}" | grep -vxE -- '--spec|--exclude' || true
      - name: Run the harness (Linux needs a virtual display)
        if: steps.choose.outputs.gating != '0'
        run: |
          set -o pipefail
          args=()
          while IFS= read -r -d '' a; do args+=("$a"); done < "$RUNNER_TEMP/native-args"
          run=(pnpm --dir test/native test -- "${args[@]}")
          if [ "$RUNNER_OS" = "Linux" ]; then run=(xvfb-run -a "${run[@]}"); fi
          "${run[@]}" 2>&1 | tee native.log
      - name: No spec skipped
        if: success() && steps.choose.outputs.gating != '0'
        run: |
          if grep -E '[0-9]+ skipped' native.log; then
            echo "::error::specs were skipped (see above); a gate run may not skip"
            exit 1
          fi
      # Never fails the job: each spec is reported as KNOWN FAILING (its task),
      # or, when it passed, with a warning to take it off the list.
      - name: Known failing specs (not gating)
        if: ${{ !cancelled() && steps.choose.outcome == 'success' && steps.choose.outputs.known != '0' }}
        continue-on-error: true
        run: |
          args=()
          while IFS=$'\t' read -r name _; do args+=("--spec" "specs/$name.e2e.mjs"); done < "$RUNNER_TEMP/known-failing"
          run=(pnpm --dir test/native test -- "${args[@]}")
          if [ "$RUNNER_OS" = "Linux" ]; then run=(xvfb-run -a "${run[@]}"); fi
          rc=0
          "${run[@]}" > known-failing.log 2>&1 || rc=$?
          sed 's/\x1b\[[0-9;]*m//g' known-failing.log > "$RUNNER_TEMP/known-clean.log"
          : > "$RUNNER_TEMP/known-summary"
          while IFS=$'\t' read -r name task; do
            if grep -F "PASSED in" "$RUNNER_TEMP/known-clean.log" | grep -qF "/specs/$name.e2e.mjs"; then
              echo "::warning::$name passed: remove it from the list (test/native/known-failing.txt, $task)"
              echo "$name: PASSED, remove it from the list ($task)" >> "$RUNNER_TEMP/known-summary"
            else
              echo "::notice::$name: KNOWN FAILING ($task)"
              echo "$name: KNOWN FAILING ($task)" >> "$RUNNER_TEMP/known-summary"
            fi
          done < "$RUNNER_TEMP/known-failing"
          cat "$RUNNER_TEMP/known-summary"
          exit "$rc"
      - name: Summary
        if: always()
        env:
          MATRIX_OS: ${{ matrix.os }}
          MATRIX_OBSIDIAN: ${{ matrix.obsidian }}
        run: |
          {
            echo "### native ($MATRIX_OS, Obsidian $MATRIX_OBSIDIAN)"
            echo '```'
            grep -E 'Spec Files:|passing|failing|skipped' native.log 2>/dev/null | sed 's/\x1b\[[0-9;]*m//g' | tail -n 80 || true
            echo '```'
            if [ -s "$RUNNER_TEMP/known-summary" ]; then
              echo "Known failing (test/native/known-failing.txt, not gating):"
              echo '```'
              cat "$RUNNER_TEMP/known-summary"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the log and the METRIC lines
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-${{ matrix.os }}-${{ matrix.obsidian }}
          path: |
            obsidian/native.log
            obsidian/known-failing.log
            obsidian/screenshots
            obsidian/perf-results
          if-no-files-found: ignore
