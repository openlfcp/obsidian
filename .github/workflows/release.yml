name: Release

# A GitHub release of the plugin (POST-011), built by CI from the tagged
# commit. Obsidian, BRAT and the community directory require the release
# tag to be exactly manifest.json's version, without a "v" ("0.2.0"), so
# only bare-version tags trigger it; scripts/release-assets.mjs refuses a
# tag that is not the manifest version. Assets: main.js, manifest.json and
# styles.css, nothing else (the community directory flags extra files). The
# notes come from docs/releases/<version>.md, which must exist.
#
# Betas (LFCP-02-094): a tag X.Y.Z-beta.N makes a GitHub pre-release with
# the same three attested assets; its manifest asset comes from
# manifest-beta.json, since manifest.json on main keeps the catalog version
# until GA. BRAT installs pre-releases; the catalog does not see them.
#
# Dry run: "Run workflow" with a version runs every check and builds the
# assets on the chosen branch, without attesting or releasing anything.

on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+", "[0-9]+.[0-9]+.[0-9]+-beta.[0-9]+"]
  workflow_dispatch:
    inputs:
      version:
        description: "The version to check as if tagged (X.Y.Z or X.Y.Z-beta.N); nothing is released"
        required: true

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Build provenance attestations of the release assets (actions/attest).
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      # The tag, or the dry run's version.
      VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
    defaults:
      run:
        working-directory: obsidian
    steps:
      - uses: actions/checkout@v4
        with:
          path: obsidian
      # A release is built from the @openlfcp/* npm packages only, as the
      # community directory's review reproduces it. A commit with the
      # development pin (sdk-ts.lock, link: dependencies) is refused.
      - name: The SDK comes from npm
        run: node scripts/check-release-deps.mjs
      # Spec at the tag in spec.lock, as in CI.
      - id: spec-lock
        run: echo "tag=$(jq -er .tag spec.lock)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: openlfcp/spec
          ref: refs/tags/${{ steps.spec-lock.outputs.tag }}
          path: spec
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: obsidian/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: obsidian/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm test
      - name: Build and check the release assets
        run: node scripts/release-assets.mjs --tag "$VERSION"
      # Signed SLSA build provenance for the files Obsidian downloads; verify
      # with `gh attestation verify main.js --repo openlfcp/obsidian`.
      - name: Attest the release assets
        if: github.event_name == 'push'
        uses: actions/attest@v4
        with:
          subject-path: |
            obsidian/release/main.js
            obsidian/release/manifest.json
            obsidian/release/styles.css
      - name: Release notes exist
        run: test -s "docs/releases/$VERSION.md"
      - name: Create the GitHub release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          beta=()
          case "$VERSION" in *-beta.*) beta=(--prerelease) ;; esac
          gh release create "$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag "${beta[@]}" \
            --title "Shared Tasks $VERSION" \
            --notes-file "docs/releases/$VERSION.md" \
            release/main.js release/manifest.json release/styles.css
